name: Backend Syntax Check

on:
  push:
    branches: [main]
    paths:
      - "backend/**/*.js"
      - "backend/package.json"
      - ".github/workflows/backend-syntax.yml"
  pull_request:
    paths:
      - "backend/**/*.js"
      - "backend/package.json"
      - ".github/workflows/backend-syntax.yml"

jobs:
  syntax:
    name: Check backend JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax check
        run: npm run check --prefix backend
